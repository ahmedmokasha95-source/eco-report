name: eco_report
description: تطبيق لرصد المخلفات البيئية وتسجيل المخالفات بالصور والموقع.
publish_to: "none"
version: 1.3.0+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.13.4
  http: ^1.2.2
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
